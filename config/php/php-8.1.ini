[PHP]
; Configuration for PHP 8.1
engine = On
short_open_tag = On
precision = 14
output_buffering = 4096
max_execution_time = 120
memory_limit = 512M
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_USER_DEPRECATED
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "C:/nobreak/logs/php/php_8.1_errors.log"
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

extension_dir = "C:/nobreak/bin/php/php-8.1/ext"
extension=curl
extension=fileinfo
extension=gd
extension=mbstring
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3

[CGI]
cgi.fix_pathinfo = 1
cgi.force_redirect = 0

[Date]
date.timezone = Asia/Seoul

[mail function]
SMTP = 127.0.0.1
smtp_port = 1025

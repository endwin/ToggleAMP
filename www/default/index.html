<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToggleAMP — Local Dev Environment</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" href="favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; padding: 3rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; max-width: 600px; border: 1px solid #334155; }
        h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 0.5rem; font-weight: 800; }
        p { color: #94a3b8; font-size: 1.05rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .badge { display: inline-block; background: #0284c7; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
        .btn { display: inline-block; background: #38bdf8; color: #0f172a; font-weight: bold; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; transition: 0.2s; }
        .btn:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">ToggleAMP v1.3.0</div>
        <h1>Welcome to ToggleAMP!</h1>
        <p>Your ultra-fast, multi-stack local development environment is up and running.</p>
        <a href="http://localhost:4000" class="btn">Open ToggleAMP Dashboard</a>
    </div>
</body>
</html>

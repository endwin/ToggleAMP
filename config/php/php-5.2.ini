[PHP]
; Configuration for PHP 5.2
engine = On
short_open_tag = On
precision = 14
output_buffering = 4096
max_execution_time = 120
memory_limit = 512M
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_USER_DEPRECATED
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "C:/end-server-main/logs/php/php_5.2_errors.log"
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

extension_dir = "C:/end-server-main/bin/php/php-5.2/ext"
extension=php_mysql.dll
extension=php_mysqli.dll
extension=php_gd2.dll
extension=php_mbstring.dll
extension=php_curl.dll
extension=php_pdo.dll
extension=php_pdo_mysql.dll

[Zend]
zend_extension_ts = "C:/end-server-main/bin/php/php-5.2/zendOptimizer/lib/ZendExtensionManager.dll"
zend_extension_manager.optimizer_ts = "C:/end-server-main/bin/php/php-5.2/zendOptimizer/lib/Optimizer"
zend_optimizer.optimization_level = 15
zend_optimizer.enable_loader = 1

[CGI]
cgi.fix_pathinfo = 1
cgi.force_redirect = 0

[Date]
date.timezone = Asia/Seoul

[mail function]
SMTP = 127.0.0.1
smtp_port = 1025

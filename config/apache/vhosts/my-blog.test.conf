<VirtualHost *:80>
    ServerName my-blog.test
    ServerAlias *.my-blog.test
    DocumentRoot "C:/end-server-main/www/my-blog"
    DirectoryIndex index.php index.html index.htm

    <Directory "C:/end-server-main/www/my-blog">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "C:/end-server-main/www/my-blog%{reqenv:SCRIPT_NAME}"
    ProxyFCGISetEnvIf "reqenv('SCRIPT_NAME') =~ m#^/?$#" SCRIPT_FILENAME "C:/end-server-main/www/my-blog/index.php"
    ProxyFCGISetEnvIf "reqenv('SCRIPT_NAME') =~ m#^$#" SCRIPT_FILENAME "C:/end-server-main/www/my-blog/index.php"

    Alias /myadmin "C:/end-server-main/bin/phpmyadmin/phpmyadmin-latest"
    <Directory "C:/end-server-main/bin/phpmyadmin/phpmyadmin-latest">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm
        ProxyFCGISetEnvIf "reqenv('SCRIPT_NAME') =~ m#^/myadmin/(.*)$#" SCRIPT_FILENAME "C:/end-server-main/bin/phpmyadmin/phpmyadmin-latest/$1"
        ProxyFCGISetEnvIf "reqenv('SCRIPT_NAME') =~ m#^/myadmin/?$#" SCRIPT_FILENAME "C:/end-server-main/bin/phpmyadmin/phpmyadmin-latest/index.php"
        ProxyFCGISetEnvIf "reqenv('SCRIPT_FILENAME') =~ m#/$#" SCRIPT_FILENAME "C:/end-server-main/bin/phpmyadmin/phpmyadmin-latest/index.php"
    </Directory>

    Alias /phpmyadmin "C:/end-server-main/bin/phpmyadmin/phpmyadmin-3.1"
    <Directory "C:/end-server-main/bin/phpmyadmin/phpmyadmin-3.1">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm
        ProxyFCGISetEnvIf "reqenv('SCRIPT_NAME') =~ m#^/phpmyadmin/(.*)$#" SCRIPT_FILENAME "C:/end-server-main/bin/phpmyadmin/phpmyadmin-3.1/$1"
        ProxyFCGISetEnvIf "reqenv('SCRIPT_NAME') =~ m#^/phpmyadmin/?$#" SCRIPT_FILENAME "C:/end-server-main/bin/phpmyadmin/phpmyadmin-3.1/index.php"
        ProxyFCGISetEnvIf "reqenv('SCRIPT_FILENAME') =~ m#/$#" SCRIPT_FILENAME "C:/end-server-main/bin/phpmyadmin/phpmyadmin-3.1/index.php"
    </Directory>


    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000/"
    </FilesMatch>

    ErrorLog "C:/end-server-main/logs/apache/my-blog-error.log"
    CustomLog "C:/end-server-main/logs/apache/my-blog-access.log" common
</VirtualHost>
